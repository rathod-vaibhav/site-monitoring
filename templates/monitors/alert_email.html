<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ email_copy.heading }} · Site Monitoring</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f5f8;color:#172033;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3f5f8;padding:32px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e5e9f0;border-radius:14px;overflow:hidden">
          <tr><td style="padding:22px 28px;background:#202631;color:#ffffff"><div style="font-size:19px;font-weight:700">Site Monitoring</div></td></tr>
          <tr><td style="padding:30px 28px 10px">
            <span style="display:inline-block;padding:6px 10px;border-radius:999px;background:{% if is_down %}#fff0f0{% else %}#eaf8f1{% endif %};color:{% if is_down %}#bd343d{% else %}#178253{% endif %};font-size:12px;font-weight:700;letter-spacing:.04em">{{ status_label }}</span>
            <h1 style="margin:16px 0 8px;font-size:24px;line-height:1.25;color:#172033">{{ email_copy.heading }}</h1>
            <p style="margin:0;color:#687386;font-size:15px;line-height:1.6">{{ email_copy.intro }}</p>
          </td></tr>
          <tr><td style="padding:18px 28px 28px">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #e7ebf1;border-radius:10px">
              <tr><td style="padding:15px 16px 6px;color:#778195;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Project</td></tr>
              <tr><td style="padding:0 16px 14px;border-bottom:1px solid #e7ebf1;color:#172033;font-size:14px;font-weight:600">{{ project_name }}</td></tr>
              <tr><td style="padding:14px 16px 6px;color:#778195;font-size:12px;text-transform:uppercase;letter-spacing:.06em">{{ email_copy.service_label }}</td></tr>
              <tr><td style="padding:0 16px 15px;color:#172033;font-size:16px;font-weight:700">{{ monitor_name }}</td></tr>
              <tr><td style="padding:14px 16px 6px;border-top:1px solid #e7ebf1;color:#778195;font-size:12px;text-transform:uppercase;letter-spacing:.06em">{{ email_copy.details_label }}</td></tr>
              <tr><td style="padding:0 16px 16px;color:#394458;font-size:14px;line-height:1.6;word-break:break-word">{{ detail }}</td></tr>
            </table>
            <p style="margin:20px 0 0;color:#687386;font-size:13px;line-height:1.6">{{ email_copy.closing }}</p>
          </td></tr>
          <tr><td style="padding:17px 28px;border-top:1px solid #edf0f4;color:#8a93a2;font-size:12px;line-height:1.5">{{ email_copy.footer }}<br>{{ email_copy.footer_note }}</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
