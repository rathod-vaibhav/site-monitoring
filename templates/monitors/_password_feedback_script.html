<script>
(() => {
  const commonPasswords = new Set([
    "password", "password1", "12345678", "qwerty123", "123456789",
    "iloveyou", "admin123", "welcome123", "letmein123", "welcome1",
  ]);

  const updateForm = form => {
    const input = form.querySelector('[data-password-input]:not([data-password-input="false"])');
    if (!input) return;

    const value = input.value.trim();
    const normalized = value.toLowerCase();
    const fieldValue = name => form.querySelector(`[name="${name}"]`)?.value?.trim().toLowerCase() || "";
    const personalInfo = [
      fieldValue("username"), fieldValue("email"), fieldValue("first_name"), fieldValue("last_name"),
      ...(input.dataset.personalInfo || "").toLowerCase().split(/\s+/),
    ].filter(item => item.length >= 3);
    const valid = {
      similar: value.length >= 3 && !personalInfo.some(item => normalized.includes(item) || (item.length >= 5 && item.includes(normalized))),
      length: value.length >= 8,
      common: value.length > 0 && !commonPasswords.has(normalized),
      numeric: value.length > 0 && !/^\d+$/.test(value),
    };

    form.querySelectorAll("[data-password-rule]").forEach(rule => {
      const satisfied = Boolean(valid[rule.dataset.passwordRule]);
      rule.classList.toggle("is-valid", satisfied);
      rule.setAttribute("aria-checked", String(satisfied));
    });
  };

  const updateAll = () => document.querySelectorAll("form").forEach(updateForm);
  document.addEventListener("input", event => {
    const form = event.target.closest("form");
    if (form) updateForm(form);
  });
  document.addEventListener("change", event => {
    const form = event.target.closest("form");
    if (form) updateForm(form);
  });
  updateAll();
  new MutationObserver(updateAll).observe(document.body, { childList: true, subtree: true });
})();
</script>
