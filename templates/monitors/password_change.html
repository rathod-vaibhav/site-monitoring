{% extends "monitors/base.html" %}
{% block title %}Change password · Site Monitoring{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="pagehead">
    <div>
      <div class="eyebrow"><a href="{% url 'profile_edit' %}">Profile</a> · Account security</div>
      <h1>Change password</h1>
      <p class="sub">Enter your current password, then choose a new one.</p>
    </div>
  </div>
  <section class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button class="btn" type="submit">Update password</button>
        <a class="btn secondary" href="{% url 'profile_edit' %}">Cancel</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
