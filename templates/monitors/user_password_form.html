{% extends "monitors/base.html" %}
{% block title %}Reset password · Site Monitoring{% endblock %}
{% block content %}
<section class="form-card"><div class="eyebrow">Workspace settings</div><h2>Reset password</h2><p class="sub">Set a new password for {{ person.get_full_name|default:person.username }}.</p><form method="post">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="btn" type="submit">Save new password</button></div></form></section>
{% endblock %}
